appId: com.robrowser.legacy
productName: roBrowserLegacy
copyright: Copyright © roBrowserLegacy

directories:
    output: dist/Desktop
    buildResources: applications/electron

files:
    - applications/electron/main.js
    - applications/electron/main/**/*
    - applications/electron/preload/**/*
    - applications/electron/services/**/*
    - applications/electron/icon.png
    - from: dist/DesktopRenderer
      to: renderer
    - package.json
    - '!node_modules/**/*'

extraMetadata:
    main: applications/electron/main.js

asar: false

win:
    target:
        - dir
    icon: applications/electron/icon.png

linux:
    target:
        - dir
    icon: applications/electron/icon.png

mac:
    target:
        - dir
    icon: applications/electron/icon.png
